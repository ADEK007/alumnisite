services:
  - type: web
    name: alumnisite
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run render-build
    startCommand: npm run render-start
    healthCheckPath: /health
    autoDeploy: yes
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "10000"
      - key: GOOGLE_SPREADSHEET_ID
        value: "1VX8FkbTTi5gAxRa9Uv9rCc3pMTS51sawRfngXbL5xXY"
      - key: SHEET_NAMES
        value: "Sheet1,Sheet2"
      - key: WRITE_SHEET
        value: "Sheet2"
      - key: DATA_RANGE
        value: "A:O"
#
# IMPORTANT: Do NOT add GOOGLE_SERVICE_ACCOUNT_B64 to this render.yaml file.
#            Blueprint/yaml env vars ALWAYS override dashboard secrets, even
#            when empty, which would erase the secret you paste in the UI.
#            Instead: Render Dashboard → Environment → Add Secret File →
#            Key: GOOGLE_SERVICE_ACCOUNT_B64, value: base64 of service-account-key.json

